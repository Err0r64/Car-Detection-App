<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' file:; connect-src 'self' file:" />
  <title>Capstone Video Editor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Landing: project picker -->
  <section id="view-landing">
    <div id="landing-card">
      <header id="landing-header">
        <h1 id="landing-logo">
          <span class="landing-logo-lockup">
            <img class="landing-logo-image logo-light" src="assets/apexiel-logo.png" alt="Apexiel" />
            <img class="landing-logo-image logo-dark-base" src="assets/apexiel-logo.png" alt="" aria-hidden="true" />
            <span class="logo-dark-accent-crop" aria-hidden="true">
              <img class="landing-logo-image logo-dark-accent" src="assets/apexiel-logo.png" alt="" />
            </span>
          </span>
        </h1>
        <button
          type="button"
          class="icon-button theme-toggle"
          data-theme-toggle
          aria-label="Switch to light mode"
          title="Switch to light mode"
        >
          <span class="theme-icon theme-icon-light" aria-hidden="true">&#9728;</span>
          <span class="theme-icon theme-icon-dark" aria-hidden="true">&#9790;</span>
        </button>
      </header>

      <section id="project-section" aria-labelledby="project-section-title">
        <div id="project-section-header">
          <h2 id="project-section-title">Projects</h2>
          <button
            type="button"
            class="icon-button add-project"
            id="btn-new-project"
            aria-label="New project"
            title="New project"
          >
            <span aria-hidden="true">+</span>
          </button>
        </div>
        <div id="project-location">
          <span class="project-location-label">Project location</span>
          <span id="projects-root-path"></span>
          <button id="btn-change-project-root" type="button">Change</button>
        </div>
        <div id="project-grid">
          <!-- existing project tiles injected by app.js -->
        </div>
        <div id="project-empty" hidden>No projects yet</div>
      </section>
    </div>
  </section>

  <dialog id="create-project-dialog" aria-labelledby="create-project-title">
    <form id="create-project-form">
      <h2 id="create-project-title">New Project</h2>
      <label for="project-name-input">Project name</label>
      <input id="project-name-input" type="text" maxlength="100" autocomplete="off" />
      <div id="project-name-error" role="alert" hidden></div>
      <div class="create-project-actions">
        <button id="btn-create-project-cancel" type="button" class="dialog-button dialog-button-secondary">Cancel</button>
        <button id="btn-create-project-confirm" type="submit" class="dialog-button dialog-button-primary">Create</button>
      </div>
    </form>
  </dialog>

  <!-- Editor -->
  <section id="view-editor" hidden>
    <header id="status-header">
      <span id="video-name">No Video Selected</span>
      <button
        type="button"
        class="icon-button theme-toggle"
        data-theme-toggle
        aria-label="Switch to light mode"
        title="Switch to light mode"
      >
        <span class="theme-icon theme-icon-light" aria-hidden="true">&#9728;</span>
        <span class="theme-icon theme-icon-dark" aria-hidden="true">&#9790;</span>
      </button>
    </header>

    <div id="layout">
      <nav id="button-column">
        <button id="btn-open-video">Import Video</button>
        <button id="btn-detect-vehicles" disabled>Detect Vehicles</button>
        <button id="btn-save-changes" disabled>Save Changes</button>
        <button id="btn-export" disabled>Export</button>
        <button id="btn-load-project" class="nav-secondary">Load Project</button>
        <div class="nav-spacer"></div>
        <button id="btn-back-to-projects" class="nav-secondary">Projects</button>
      </nav>

      <aside id="analysis-panel" hidden>
        <h2 id="panel-title">Analysis</h2>
        <div id="panel-list"></div>
      </aside>

      <main id="main-area">
        <div id="video-container">
          <video id="video-player" controls></video>
          <div id="video-placeholder">Import a video to begin</div>
        </div>
        <div id="timeline" hidden>
          <div id="timeline-ruler"></div>
          <div id="timeline-track"></div>
        </div>
        <div id="status-line" hidden>
          <span id="status-stage"></span>
          <span id="status-elapsed"></span>
          <span id="status-tokens"></span>
          <button id="btn-cancel" hidden>Cancel</button>
        </div>
      </main>
    </div>
  </section>

  <dialog id="export-dialog" aria-labelledby="export-dialog-title">
    <div class="export-dialog-content">
      <h2 id="export-dialog-title">Export Clips</h2>

      <label class="export-folder-field" for="export-folder-path">Output folder</label>
      <div class="export-folder-row">
        <input id="export-folder-path" type="text" readonly aria-label="Output folder" />
        <button id="btn-choose-export-folder" type="button" class="dialog-button dialog-button-secondary">Choose Folder</button>
      </div>

      <fieldset class="export-scope">
        <legend>Scope</legend>
        <label><input type="radio" name="export-scope" value="all" /> All intervals</label>
        <label><input type="radio" name="export-scope" value="subject" /> Subject only</label>
        <label><input type="radio" name="export-scope" value="selected" checked /> Selected interval</label>
      </fieldset>

      <div id="export-count" class="export-count">0 clips</div>
      <div id="export-status" class="export-status" role="status" hidden></div>

      <div id="export-progress" class="export-progress" hidden>
        <div class="export-progress-label">
          <span>Overall</span>
          <span id="export-overall-label">0 of 0 completed</span>
        </div>
        <progress id="export-overall-progress" max="1" value="0"></progress>
        <div class="export-progress-label">
          <span id="export-current-name">Waiting for ffmpeg</span>
          <span id="export-current-percent">0%</span>
        </div>
        <progress id="export-clip-progress" max="1" value="0"></progress>
      </div>

      <section id="export-summary" class="export-summary" aria-labelledby="export-summary-title" hidden>
        <h3 id="export-summary-title">Export complete</h3>
        <p id="export-summary-message"></p>
        <div class="export-summary-columns">
          <div>
            <h4>Succeeded</h4>
            <ul id="export-success-list"></ul>
          </div>
          <div>
            <h4>Failed</h4>
            <ul id="export-failure-list"></ul>
          </div>
        </div>
        <div class="export-summary-footer">
          <span id="export-manifest-label"></span>
          <button id="btn-open-export-folder" type="button" class="dialog-button dialog-button-secondary">Open Folder</button>
        </div>
      </section>

      <div class="export-dialog-actions">
        <button id="btn-export-dialog-cancel" type="button" class="dialog-button dialog-button-secondary">Cancel</button>
        <button id="btn-start-export" type="button" class="dialog-button dialog-button-primary" disabled>Start Export</button>
      </div>
    </div>
  </dialog>
  <script src="state.js"></script>
  <script src="timeline.js"></script>
  <script src="panel.js"></script>
  <script src="export-scope.js"></script>
  <script src="app.js"></script>
</body>
</html>
