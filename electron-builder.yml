appId: com.apexiel.capstonevideoeditor
productName: Capstone Video Editor
asar: true
compression: normal

directories:
  output: dist

files:
  - main.js
  - preload.js
  - analysis-lifecycle.js
  - clip-export.js
  - cloud-analysis-client.js
  - runtime-config.js
  - runtime-environment.js
  - runtime-paths.js
  - project-workspace.js
  - prompt-profile-client.js
  - python-runtime.js
  - runtime-environment.js
  - renderer/**/*
  - package.json

extraResources:
  - from: config.json
    to: config.json
  - from: detections.schema.json
    to: detections.schema.json
  - from: pipeline
    to: pipeline
    filter:
      - "**/*.py"
      - requirements.txt
      - "!tests/**/*"
  - from: stub
    to: stub
    filter:
      - "**/*.py"

mac:
  category: public.app-category.video
  executableName: Capstone Video Editor
  target:
    - target: dmg
  identity: null
  hardenedRuntime: false

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  title: ${productName} ${version}

win:
  executableName: Capstone Video Editor
  target:
    - target: nsis
      arch:
        - x64

nsis:
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Capstone Video Editor
  uninstallDisplayName: Capstone Video Editor
  runAfterFinish: true
