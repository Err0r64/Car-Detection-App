<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' file:; connect-src 'self' file:" />
  <title>Capstone Video Editor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Landing: project picker -->
  <section id="view-landing">
    <div id="landing-card">
      <h1 id="landing-logo">Apexiel</h1>
      <div id="project-grid">
        <button class="project-tile" id="btn-new-project">New Project</button>
        <!-- existing project tiles injected by app.js -->
      </div>
    </div>
  </section>

  <!-- Editor -->
  <section id="view-editor" hidden>
    <header id="status-header">
      <span id="video-name">No Video Selected</span>
    </header>

    <div id="layout">
      <nav id="button-column">
        <button id="btn-open-video">Open Video</button>
        <button id="btn-detect-vehicles" disabled>Detect Vehicles</button>
        <button id="btn-save-changes" disabled>Save Changes</button>
        <button id="btn-export" disabled>Export</button>
        <button id="btn-load-project" class="nav-secondary">Load Project</button>
        <div class="nav-spacer"></div>
        <button id="btn-back-to-projects" class="nav-secondary">Projects</button>
      </nav>

      <aside id="analysis-panel" hidden>
        <h2 id="panel-title">Analysis</h2>
        <div id="panel-list"></div>
      </aside>

      <main id="main-area">
        <div id="video-container">
          <video id="video-player" controls></video>
          <div id="video-placeholder">Open a video to begin</div>
        </div>
        <div id="timeline" hidden>
          <div id="timeline-ruler"></div>
          <div id="timeline-track"></div>
        </div>
        <div id="status-line" hidden>
          <span id="status-stage"></span>
          <span id="status-elapsed"></span>
          <span id="status-tokens"></span>
          <button id="btn-cancel" hidden>Cancel</button>
        </div>
      </main>
    </div>
  </section>

  <dialog id="export-dialog" aria-labelledby="export-dialog-title">
    <div class="export-dialog-content">
      <h2 id="export-dialog-title">Export Clips</h2>

      <label class="export-folder-field" for="export-folder-path">Output folder</label>
      <div class="export-folder-row">
        <input id="export-folder-path" type="text" readonly aria-label="Output folder" />
        <button id="btn-choose-export-folder" type="button" class="dialog-button dialog-button-secondary">Choose Folder</button>
      </div>

      <fieldset class="export-scope">
        <legend>Scope</legend>
        <label><input type="radio" name="export-scope" value="all" /> All intervals</label>
        <label><input type="radio" name="export-scope" value="subject" /> Subject only</label>
        <label><input type="radio" name="export-scope" value="selected" checked /> Selected interval</label>
      </fieldset>

      <div id="export-count" class="export-count">0 clips</div>
      <div id="export-status" class="export-status" role="status" hidden></div>

      <div class="export-dialog-actions">
        <button id="btn-export-dialog-cancel" type="button" class="dialog-button dialog-button-secondary">Cancel</button>
        <button id="btn-start-export" type="button" class="dialog-button dialog-button-primary" disabled>Start Export</button>
      </div>
    </div>
  </dialog>
  <script src="state.js"></script>
  <script src="timeline.js"></script>
  <script src="panel.js"></script>
  <script src="export-scope.js"></script>
  <script src="app.js"></script>
</body>
</html>
